# This is a Declarative Automation Bundle definition for dab_project.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: dab_project
  uuid: cf406060-be42-4155-ae2d-44443f09e6ea

include:
  - resources/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
    default: "citibike_dev"
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://adb-7405616655213314.14.azuredatabricks.net
    variables:
      catalog:
        default: "citibike_dev"
      schema: dev
    presets:
      artifacts_dynamic_version: true
  uat:
    mode: production 
    workspace:
      host: https://adb-7405615239283741.1.azuredatabricks.net
      # We explicitly deploy to /Workspace/Users/akshaykatkam0801@outlook.com to make sure we only have a single copy.
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog:
        default: "citibike_uat"
      schema: prod
    permissions:
      - user_name: akshaykatkam0801@outlook.com
        level: CAN_MANAGE
  prod:
    mode: production
    workspace:
      host: https://adb-7405611250642687.7.azuredatabricks.net
      # We explicitly deploy to /Workspace/Users/akshaykatkam0801@outlook.com to make sure we only have a single copy.
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog:
        default: "citibike_prod"
      schema: prod
    permissions:
      - user_name: akshaykatkam0801@outlook.com
        level: CAN_MANAGE  
